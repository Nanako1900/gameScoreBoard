# Coolify stack (New Resource → Docker Compose). See docs/DEPLOY-COOLIFY.md and,
# for moving the API off the Worker, docs/DEPLOY-CUTOVER.md.
#
# Secrets come from Coolify's environment variables — mark them runtime-only,
# not build variables. ${SERVICE_PASSWORD_POSTGRES} is generated by Coolify.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edg
      POSTGRES_USER: edg
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      # C collation: ORDER BY on text sorts by code point, like D1 (SQLite BINARY).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edg -d edg"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot: apply server/migrations, then exit. The app only starts after this
  # exits 0, so a failed migration never meets live traffic. Also the container
  # the D1 import runs in (docs/DEPLOY-CUTOVER.md).
  migrate:
    image: ghcr.io/nanako1900/gamescoreboard:${APP_TAG:-latest}
    command: ["node", "server/dist/migrate-main.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://edg:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/edg
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  app:
    image: ghcr.io/nanako1900/gamescoreboard:${APP_TAG:-latest}
    restart: unless-stopped
    init: true
    expose:
      - "8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      TZ: UTC
      # Discord share page (formerly the discord-share Worker). Comma-separated;
      # add discord-next.nanako.org while verifying a cutover.
      SHARE_HOST: ${SHARE_HOST:-discord.nanako.org}
      SITE_URL: ${SITE_URL:-https://discord.nanako.org}
      SITE_NAME: ${SITE_NAME:-Nanako's Community}
      GUILD_ID: ${GUILD_ID:-1114391825336250432}
      INVITE_CODE: ${INVITE_CODE:-}
      SNAPSHOT_FILE: /data/share-snapshot.json
      # Scoreboard API (formerly the gamescoreboard Worker). Leave API_HOST empty
      # until the cutover: the database and the job timer only matter once the
      # api hostname actually points here.
      API_HOST: ${API_HOST:-}
      DATABASE_URL: postgres://edg:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/edg
      JOBS_ENABLED: ${JOBS_ENABLED:-false}
      APP_URL: ${APP_URL:-https://api.nanako.org}
      FRONTEND_URL: ${FRONTEND_URL:-https://score.nanako.org}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://score.nanako.org}
      HOST_ONLY_COOKIES: ${HOST_ONLY_COOKIES:-1}
      RESET_TZ_OFFSET: ${RESET_TZ_OFFSET:-8}
      OAUTH_BASE_URL: ${OAUTH_BASE_URL:-https://nanako.org}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-4d7e107d75ac6bf7f3c2b7132b036c3f}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_SUBJECT_IDS: ${ADMIN_SUBJECT_IDS:-}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      AVATAR_ALLOWED_HOSTS: ${AVATAR_ALLOWED_HOSTS:-}
      READ_ONLY: ${READ_ONLY:-}
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /healthz answers before Host routing and checks liveness only.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 384m
    stop_grace_period: 15s
    logging: *logging

  # Outbound-only tunnel: no inbound ports on the host, origin IP never exposed.
  # Public hostnames are configured in the Cloudflare dashboard and point at
  # http://app:8787. Drop this service if you use Coolify's own Tunnel setup.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

  # Daily encrypted off-site backup of PostgreSQL. Needs an S3-compatible bucket
  # (Cloudflare R2 works): uncomment and set the variables before the cutover —
  # see docs/DEPLOY-CUTOVER.md, "备份".
  # pg-backup:
  #   image: eeshugerman/postgres-backup-s3:17
  #   restart: unless-stopped
  #   environment:
  #     SCHEDULE: "@daily"
  #     BACKUP_KEEP_DAYS: "14"
  #     PASSPHRASE: ${BACKUP_PASSPHRASE}
  #     S3_ENDPOINT: ${S3_ENDPOINT}
  #     S3_REGION: auto
  #     S3_BUCKET: ${S3_BUCKET}
  #     S3_PREFIX: pg
  #     S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  #     S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  #     POSTGRES_HOST: postgres
  #     POSTGRES_DATABASE: edg
  #     POSTGRES_USER: edg
  #     POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   logging: *logging

volumes:
  pgdata:
  app-data:
