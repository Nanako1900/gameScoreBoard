# Coolify stack (New Resource → Docker Compose). See docs/DEPLOY-COOLIFY.md and,
# for moving the API off the Worker, docs/DEPLOY-CUTOVER.md.
#
# Secrets come from Coolify's environment variables — mark them runtime-only,
# not build variables. ${SERVICE_PASSWORD_POSTGRES} is generated by Coolify.
#
# Traffic comes in through Coolify's own proxy on the server's public IP: in
# Coolify, give the `app` service its domains (https, port 8787 — e.g.
# capi.nanako.org, discord.nanako.org). No other service gets a domain or a
# published port; postgres and the bot stay on the stack's private network.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edg
      POSTGRES_USER: edg
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      # C collation: ORDER BY on text sorts by code point, like D1 (SQLite BINARY).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      # Over TCP: during first-time init the entrypoint runs a socket-only
      # server, which a socket check would already call healthy.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U edg -d edg"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot: apply server/migrations, then exit. The app only starts after this
  # exits 0, so a failed migration never meets live traffic. Also the container
  # the D1 import runs in (docs/DEPLOY-CUTOVER.md). Images built before P3a have
  # no migrations: then it does nothing, so rolling APP_TAG back to one of them
  # (or deploying this file before the new image is pushed) still starts the app.
  migrate:
    image: ghcr.io/nanako1900/gamescoreboard:${APP_TAG:-latest}
    command:
      - sh
      - -c
      - if [ -f server/dist/migrate-main.js ]; then exec node server/dist/migrate-main.js; fi; echo "this image has no migrations, nothing to do"
    restart: "no"
    environment:
      DATABASE_URL: postgres://edg:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/edg
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  app:
    image: ghcr.io/nanako1900/gamescoreboard:${APP_TAG:-latest}
    restart: unless-stopped
    init: true
    # Coolify's proxy reaches it here; the Coolify domains for this service use
    # port 8787. One port serves every hostname, split by the Host header.
    expose:
      - "8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      TZ: UTC
      # Discord share page (formerly the discord-share Worker). Comma-separated;
      # add discord-next.nanako.org while verifying a cutover.
      SHARE_HOST: ${SHARE_HOST:-discord.nanako.org}
      SITE_URL: ${SITE_URL:-https://discord.nanako.org}
      SITE_NAME: ${SITE_NAME:-Nanako's Community}
      GUILD_ID: ${GUILD_ID:-1114391825336250432}
      INVITE_CODE: ${INVITE_CODE:-}
      SNAPSHOT_FILE: /data/share-snapshot.json
      # Scoreboard API (formerly the gamescoreboard Worker). Leave API_HOST empty
      # until the cutover: then no API is built at all, and none of the secrets
      # below are needed yet. With API_HOST set but a secret missing, the api
      # hostnames answer 503 — the share page keeps working either way.
      API_HOST: ${API_HOST:-}
      DATABASE_URL: postgres://edg:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/edg
      # Timer for heal, overdue judging and the weekly report (1/true/yes).
      JOBS_ENABLED: ${JOBS_ENABLED:-false}
      APP_URL: ${APP_URL:-https://capi.nanako.org}
      FRONTEND_URL: ${FRONTEND_URL:-https://community.nanako.org}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://community.nanako.org}
      HOST_ONLY_COOKIES: ${HOST_ONLY_COOKIES:-1}
      RESET_TZ_OFFSET: ${RESET_TZ_OFFSET:-8}
      OAUTH_BASE_URL: ${OAUTH_BASE_URL:-https://nanako.org}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-4d7e107d75ac6bf7f3c2b7132b036c3f}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_SUBJECT_IDS: ${ADMIN_SUBJECT_IDS:-}
      # Same as the Worker's wrangler.toml: logging in re-grants admin to this
      # name, so the board can never be left without one. Ignored once
      # ADMIN_SUBJECT_IDS is set.
      ADMIN_USERNAMES: "${ADMIN_USERNAMES:-Hongyu Qi}"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      AVATAR_ALLOWED_HOSTS: ${AVATAR_ALLOWED_HOSTS:-}
      READ_ONLY: ${READ_ONLY:-}
      # Discord account binding (/link/discord): the bot's application,
      # Developer Portal → OAuth2. See docs/DEPLOY-DISCORD.md.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /healthz answers before Host routing and checks liveness only.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 384m
    stop_grace_period: 15s
    logging: *logging

  # Discord bot (P4): one outbound Gateway connection, no ports, nothing routed
  # to it — if it is down, only the slash commands are; the website is not.
  # See docs/DEPLOY-DISCORD.md.
  bot:
    image: ghcr.io/nanako1900/gamescoreboard:${APP_TAG:-latest}
    command: ["node", "--enable-source-maps", "server/dist/bot-main.js"]
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      TZ: UTC
      # Empty until the Developer Portal steps are done: the bot then idles
      # (healthy, /status says "disabled") instead of crash-looping.
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      # The Application ID — the same number as DISCORD_CLIENT_ID.
      DISCORD_APP_ID: ${DISCORD_APP_ID:-}
      GUILD_ID: ${GUILD_ID:-1114391825336250432}
      DATABASE_URL: postgres://edg:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/edg
      APP_URL: ${APP_URL:-https://capi.nanako.org}
      FRONTEND_URL: ${FRONTEND_URL:-https://community.nanako.org}
      # Same switch as the app's: /unlink refuses while it is on.
      READ_ONLY: ${READ_ONLY:-}
      # P5: the private channel verdicts are posted to (#edg-信誉分). Empty:
      # nothing is posted. See docs/DEPLOY-DISCORD.md, "判决播报".
      DISCORD_VERDICT_CHANNEL_ID: ${DISCORD_VERDICT_CHANNEL_ID:-}
      # P6: a statement written in Discord is judged on the spot, by the same
      # AI as the web — so the bot needs the same key.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      # P7: where session cards go (#约局). Empty: no cards. /yue's "今晚 20:00"
      # is in this time zone, like the web's.
      DISCORD_SESSION_CHANNEL_ID: ${DISCORD_SESSION_CHANNEL_ID:-}
      RESET_TZ_OFFSET: ${RESET_TZ_OFFSET:-8}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Liveness only (:8788/healthz); :8788/status says whether the Gateway is up.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8788/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 256m
    stop_grace_period: 15s
    logging: *logging

  # Daily encrypted off-site backup of PostgreSQL. Needs an S3-compatible bucket
  # (Cloudflare R2 works): uncomment and set the variables before the cutover —
  # see docs/DEPLOY-CUTOVER.md, "备份".
  # pg-backup:
  #   image: eeshugerman/postgres-backup-s3:17
  #   restart: unless-stopped
  #   environment:
  #     SCHEDULE: "@daily"
  #     BACKUP_KEEP_DAYS: "14"
  #     PASSPHRASE: ${BACKUP_PASSPHRASE}
  #     S3_ENDPOINT: ${S3_ENDPOINT}
  #     S3_REGION: auto
  #     S3_BUCKET: ${S3_BUCKET}
  #     S3_PREFIX: pg
  #     S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  #     S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  #     POSTGRES_HOST: postgres
  #     POSTGRES_DATABASE: edg
  #     POSTGRES_USER: edg
  #     POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   logging: *logging

volumes:
  pgdata:
  app-data:
