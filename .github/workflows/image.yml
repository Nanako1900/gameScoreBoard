# Builds the server image. On PRs it only builds (proves the Dockerfile works);
# on main it also pushes ghcr.io/nanako1900/gamescoreboard:<sha> and :latest,
# which Coolify pulls. Rolling back = setting APP_TAG to an older sha.
name: Image

on:
  pull_request:
    paths:
      - server/**
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - .github/workflows/image.yml
  push:
    branches: [main]
    paths:
      - server/**
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - .github/workflows/image.yml
  workflow_dispatch:

env:
  # GHCR names must be lowercase; the account is Nanako1900.
  IMAGE: ghcr.io/nanako1900/gamescoreboard

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
